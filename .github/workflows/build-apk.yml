name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare environment & keystore
        run: |
          # Ensure gradlew has execute permissions
          chmod +x ./gradlew

          # Ensure empty .env file exists for secrets-gradle-plugin
          touch .env

          # 1. Restore from debug.keystore.base64 file if present in repository
          if [ -f debug.keystore.base64 ]; then
            echo "Attempting to restore debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -D debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # 2. If debug.keystore still does not exist, generate standard debug.keystore with keytool
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating standard Android debug.keystore using keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

          # 3. Verify debug.keystore is ready
          if [ -f debug.keystore ]; then
            echo "SUCCESS: Keystore is verified and ready:"
            ls -lh debug.keystore
          else
            echo "ERROR: Failed to establish debug.keystore"
            exit 1
          fi

      - name: Build Release & Debug APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Sign Release APK (Play Protect Compliant Non-Debuggable Build)
        run: |
          RELEASE_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          RELEASE_ALIGNED="app/build/outputs/apk/debug/Ekagrata-Release.apk"

          if [ -f "$RELEASE_UNSIGNED" ]; then
            # Generate dedicated release keystore if not present
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storepass ekagrata123 \
              -alias ekagratakey \
              -keypass ekagrata123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Bidhan Kumar Paul, OU=Ekagrata Focus, O=BidhanKumarPaul, C=IN"

            ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" | sort -V | tail -n 1)
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)

            if [ -n "$ZIPALIGN" ] && [ -n "$APKSIGNER" ]; then
              "$ZIPALIGN" -v -p 4 "$RELEASE_UNSIGNED" "$RELEASE_ALIGNED"
              "$APKSIGNER" sign \
                --ks release.keystore \
                --ks-key-alias ekagratakey \
                --ks-pass pass:ekagrata123 \
                --key-pass pass:ekagrata123 \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "$RELEASE_ALIGNED"
              echo "Successfully signed Play-Protect-compliant Ekagrata-Release.apk"
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ekagrata-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (Workflow Dispatch or Tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Ekāgratā Launcher v1.0 (Build ${{ github.run_number }})"
          body: |
            ### Ekāgratā Android Launcher Build
            - Built automatically by GitHub Actions.
            - Download `app-debug.apk` below and install directly onto your Android device.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
